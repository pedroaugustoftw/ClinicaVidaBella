name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    # Public repositories support free Pages hosting. Private repositories can
    # be published manually after Pages is enabled on an eligible account.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Compilar site
        run: npm run build
        env:
          VITE_BASE_PATH: /ClinicaVidaBella/
      - name: Configurar Pages
        uses: actions/configure-pages@v6.0.0
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.1
